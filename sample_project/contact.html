<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sample Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Get in Touch</h2>
        <p>If you have any questions, please feel free to reach out to us using the form below (note: this is a non-functional form example).</p>
        
        <form id="contactForm">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <div>
                <button type="submit">Send Message</button>
            </div>
        </form>
        <p>Alternatively, you can contact us at: <a href="mailto:info@example.com">info@example.com</a></p>
    </div>

    <footer>
        <p>&copy; 2023 Sample Project</p>
    </footer>

    <script src="js/script.js"></script>
    <script>
        // Add a simple form submission handler for demonstration
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent actual submission
            alert('Form submitted! (This is a demo, no data was sent.)');
            this.reset(); // Reset the form fields
        });
    </script>
</body>
</html>
